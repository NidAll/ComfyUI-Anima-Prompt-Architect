name: Portable tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install safetensors
      - run: python -m unittest discover -s tests -p 'test_fusion.py' -v
      - run: python -m unittest discover -s tests -p 'test_artifact.py' -v
